services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-focustrail}
    volumes:
      - focus_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - focus-net

  api:
    image: ${IMAGE:-ghcr.io/isadfrn/focus-trail-backend:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-focus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-focustrail}?schema=public
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://isabellanunes.dev}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-604800}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
    ports:
      # Porta 3002 no host da VPS para evitar conflito com a porta 3001 de isabellanunes.dev
      - "127.0.0.1:3002:3001"
    networks:
      - focus-net

volumes:
  focus_db_data:

networks:
  focus-net:
    name: focus-net
