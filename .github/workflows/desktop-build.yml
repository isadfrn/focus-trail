name: Build desktop (Tauri)

# Gera os instaladores desktop (macOS, Windows e Linux) a cada tag de release
# (v*) e anexa os arquivos ao GitHub Release correspondente. Também pode ser
# disparado manualmente (workflow_dispatch) — nesse caso os bundles ficam como
# artifacts do run (não cria Release).
#
# Pré-requisitos (precisam estar COMMITADOS no repo):
#   - frontend/src-tauri/ (config + Cargo.lock; target/ e gen/schemas são ignorados)
#   - frontend/package.json + frontend/package-lock.json com @tauri-apps/cli e @tauri-apps/api
#
# Cada plataforma é compilada no seu próprio SO (o Tauri não faz cross-compile).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Binário universal (Apple Silicon + Intel) num único .dmg.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # 22.04 dá compatibilidade de glibc mais ampla para o .AppImage/.deb.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          # WebView2 já vem instalado no runner do Windows.
          - platform: windows-latest
            args: ""
            rust-targets: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Dependências do sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Instala dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Sincroniza a versão do bundle com a tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: frontend
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version='${VERSION}';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');console.log('versão do bundle =',j.version)"

      - name: Build Tauri (anexa ao Release quando for tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Focus Trail ${{ github.ref_name }}"
          releaseBody: "Baixe o instalador do seu sistema: macOS (.dmg), Windows (.msi/.exe) ou Linux (.AppImage/.deb)."
          releaseDraft: false
          prerelease: false

      - name: Sobe os bundles como artifacts do run
        uses: actions/upload-artifact@v4
        with:
          name: focus-trail-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            frontend/src-tauri/target/release/bundle/**
            frontend/src-tauri/target/universal-apple-darwin/release/bundle/**
