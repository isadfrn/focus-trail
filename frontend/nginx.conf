server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /app/index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        return 301 /app/;
    }
}
